<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Reply Desk — N. Ekienabor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">
  <nav class="top">
    <a class="mark" href="/">N<span>.</span>Ekienabor</a>
    <div class="links"><a href="/">← portfolio</a><a href="#" id="logout" hidden>sign out</a></div>
  </nav>

  <!-- Sign in -->
  <div id="login" style="padding-block:56px">
    <span class="label" style="padding:0">Reply desk</span>
    <h1 class="inbox-title">Sign in</h1>
    <form id="login-form" novalidate style="margin-top:16px">
      <label class="f" for="pw">Admin password<input id="pw" type="password" autocomplete="current-password" required></label>
      <div class="btns"><button class="btn accent" type="submit" id="login-btn">Open messages</button></div>
      <p class="note" id="login-status" role="status"></p>
    </form>
  </div>

  <!-- Inbox -->
  <div id="desk" hidden>
    <div class="inbox-head">
      <div><span class="label" style="padding:0">Reply desk</span><h1>Messages</h1></div>
      <div class="btns" style="align-items:center"><span class="note mono" id="inbox-count"></span><button class="btn ghost" id="reload" type="button">Refresh</button></div>
    </div>
    <div class="panes">
      <div class="list" id="thread-list"><div class="empty">Loading messages…</div></div>
      <div class="convo">
        <div class="convo-head" id="c-head"><b>No conversation selected</b><span class="note">Pick a message on the left to read and reply.</span></div>
        <div class="convo-body" id="c-body"></div>
        <form class="convo-foot" id="reply-form" hidden novalidate>
          <label class="f" for="r-text">Your reply<textarea id="r-text" maxlength="2000" required placeholder="Thanks for reaching out…"></textarea></label>
          <div class="btns"><button class="btn accent" id="r-send" type="submit">Send reply</button></div>
          <p class="note" id="r-status" role="status"></p>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const fmt = (t) => new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  let pw = null, threads = [], activeId = null;
  try { pw = sessionStorage.getItem("nosa-admin"); } catch (e) {}

  const api = (path, opts = {}) =>
    fetch(path, { ...opts, headers: { "Content-Type": "application/json", Authorization: "Bearer " + pw, ...(opts.headers || {}) } });

  async function load(fromLogin) {
    const r = await api("/api/admin/threads");
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (r.status === 401) { pw = null; try { sessionStorage.removeItem("nosa-admin"); } catch (e) {} }
      showLogin(fromLogin ? (j.error || "Couldn't sign in.") : "");
      return;
    }
    $("login").hidden = true; $("desk").hidden = false; $("logout").hidden = false;
    threads = j.threads || [];
    if (!threads.find((t) => t.id === activeId)) activeId = threads[0] ? threads[0].id : null;
    renderList(); renderConvo();
  }

  function showLogin(msg) {
    $("login").hidden = false; $("desk").hidden = true; $("logout").hidden = true;
    $("login-status").className = "note warn"; $("login-status").textContent = msg || "";
  }

  function bubble(m, name) {
    const d = document.createElement("div");
    d.className = "bubble" + (m.from === "owner" ? " owner" : "");
    const meta = document.createElement("span"); meta.className = "meta";
    meta.textContent = (m.from === "owner" ? "You" : name || "Visitor") + " · " + fmt(m.at);
    const t = document.createElement("div"); t.className = "txt"; t.textContent = m.text;
    d.append(meta, t); return d;
  }

  function renderList() {
    const list = $("thread-list"); list.textContent = "";
    const waiting = threads.filter((t) => t.awaitingReply).length;
    $("inbox-count").textContent = threads.length ? `${waiting} awaiting reply · ${threads.length} total` : "";
    if (!threads.length) {
      const e = document.createElement("div"); e.className = "empty";
      e.textContent = "No messages yet. Messages from the portfolio's contact form show up here.";
      list.append(e); return;
    }
    for (const t of threads) {
      const b = document.createElement("button"); b.type = "button";
      b.className = "item" + (t.id === activeId ? " active" : "");
      const who = document.createElement("span"); who.className = "who";
      const n = document.createElement("span"); n.textContent = t.name || "Visitor";
      const w = document.createElement("span"); w.className = "when"; w.textContent = fmt(t.updatedAt);
      who.append(n, w);
      const last = (t.messages || []).slice(-1)[0];
      const p = document.createElement("span"); p.className = "prev";
      p.textContent = last ? (last.from === "owner" ? "You: " : "") + last.text : "";
      const pill = document.createElement("span");
      pill.className = "pill " + (t.awaitingReply ? "new" : "done");
      pill.textContent = t.awaitingReply ? "Needs reply" : "Replied";
      b.append(who, p, pill);
      b.addEventListener("click", () => { activeId = t.id; renderList(); renderConvo(); });
      list.append(b);
    }
  }

  function renderConvo() {
    const t = threads.find((x) => x.id === activeId), head = $("c-head"), body = $("c-body");
    head.textContent = ""; body.textContent = "";
    if (!t) {
      const b = document.createElement("b"); b.textContent = "No conversation selected";
      const s = document.createElement("span"); s.className = "note"; s.textContent = "Pick a message on the left to read and reply.";
      head.append(b, s); $("reply-form").hidden = true; return;
    }
    const b = document.createElement("b"); b.textContent = t.name || "Visitor";
    const s = document.createElement("span"); s.className = "note mono"; s.textContent = t.email || "No email given";
    head.append(b, s);
    for (const m of t.messages || []) body.append(bubble(m, t.name));
    body.scrollTop = body.scrollHeight;
    $("reply-form").hidden = false;
  }

  $("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    pw = $("pw").value;
    if (!pw) return showLogin("Enter the password.");
    $("login-btn").disabled = true; $("login-status").className = "note"; $("login-status").textContent = "Checking…";
    try { sessionStorage.setItem("nosa-admin", pw); } catch (e) {}
    await load(true).catch(() => showLogin("Couldn't reach the server."));
    $("login-btn").disabled = false; $("pw").value = "";
  });

  $("reply-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("r-text").value.trim(), st = $("r-status");
    if (!text) { st.className = "note warn"; st.textContent = "Write a reply first."; return; }
    $("r-send").disabled = true; st.className = "note"; st.textContent = "Sending…";
    try {
      const r = await api("/api/admin/reply", { method: "POST", body: JSON.stringify({ threadId: activeId, text }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "Couldn't send the reply.");
      threads = threads.map((t) => (t.id === j.thread.id ? j.thread : t));
      threads.sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
      $("r-text").value = ""; st.className = "note ok"; st.textContent = "Reply sent. The visitor sees it on the portfolio.";
      renderList(); renderConvo();
    } catch (err) { st.className = "note warn"; st.textContent = err.message; }
    finally { $("r-send").disabled = false; }
  });

  $("reload").addEventListener("click", () => load(false));
  $("logout").addEventListener("click", (e) => {
    e.preventDefault(); pw = null;
    try { sessionStorage.removeItem("nosa-admin"); } catch (err) {}
    showLogin("");
  });
  setInterval(() => { if (pw && !document.hidden) load(false); }, 30000);

  if (pw) load(false); else showLogin("");
})();
</script>
</body>
</html>
